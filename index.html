<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin's Discipline Engine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #09090b; color: #f4f4f5; font-family: ui-sans-serif, system-ui, sans-serif; }
    .glass-card { background: rgba(18, 18, 21, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); }
    .engine-box { width: 22px; height: 22px; cursor: pointer; accent-color: #10b981; flex-shrink: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-8 space-y-6 max-w-6xl mx-auto">

  <header class="flex items-center justify-between pb-4 border-b border-gray-800">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-white text-black font-black rounded-lg flex items-center justify-center">K</div>
      <h1 class="text-base font-bold font-mono">Kevin's Discipline Engine</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-yellow-500"></span>
      <span id="syncText" class="text-xs font-mono text-gray-400">Local</span>
    </div>
  </header>

  <!-- KPI STRIP -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
    <div class="glass-card rounded-xl p-3">
      <div class="text-xs font-mono text-gray-400">MORAL</div>
      <div class="text-2xl font-bold font-mono text-white" id="kpiMoral">0%</div>
    </div>
    <div class="glass-card rounded-xl p-3">
      <div class="text-xs font-mono text-gray-400">CAREER DIALS</div>
      <div class="text-2xl font-bold font-mono text-emerald-400" id="kpiDials">0/20</div>
    </div>
    <div class="glass-card rounded-xl p-3">
      <div class="text-xs font-mono text-gray-400">CONNECTS</div>
      <div class="text-2xl font-bold font-mono text-emerald-400" id="kpiConnects">0/5</div>
    </div>
    <div class="glass-card rounded-xl p-3">
      <div class="text-xs font-mono text-gray-400">DISCIPLINE</div>
      <div class="text-2xl font-bold font-mono text-white" id="kpiDiscipline">0/4</div>
    </div>
  </div>

  <!-- 1. MORAL PILLAR -->
  <section class="glass-card rounded-xl p-5 space-y-4">
    <h2 class="text-xs font-mono font-bold uppercase tracking-wider text-gray-400">1. Moral Pillar</h2>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div id="card_morning_prayer" onclick="toggleHabitDirectly('morning_prayer')" class="p-3.5 bg-gray-900 border border-gray-800 rounded-lg flex items-center justify-between cursor-pointer">
        <div class="flex items-center space-x-3 pointer-events-none">
          <input type="checkbox" id="chk_morning_prayer" class="engine-box">
          <span class="text-xs font-semibold text-gray-200">Morning Prayer</span>
        </div>
        <span class="text-yellow-500">☀</span>
      </div>
      <div id="card_bedtime_prayer" onclick="toggleHabitDirectly('bedtime_prayer')" class="p-3.5 bg-gray-900 border border-gray-800 rounded-lg flex items-center justify-between cursor-pointer">
        <div class="flex items-center space-x-3 pointer-events-none">
          <input type="checkbox" id="chk_bedtime_prayer" class="engine-box">
          <span class="text-xs font-semibold text-gray-200">Bed Time Prayer</span>
        </div>
        <span class="text-gray-400">☽</span>
      </div>
      <div id="card_purity" onclick="toggleHabitDirectly('purity')" class="p-3.5 bg-gray-900 border border-gray-800 rounded-lg flex items-center justify-between cursor-pointer">
        <div class="flex items-center space-x-3 pointer-events-none">
          <input type="checkbox" id="chk_purity" class="engine-box">
          <span class="text-xs font-semibold text-gray-200">Kept My Purity</span>
        </div>
        <span class="text-red-500">🛡</span>
      </div>
    </div>
  </section>

  <!-- 2. CAREER PILLAR -->
  <section class="glass-card rounded-xl p-5 space-y-4">
    <h2 class="text-xs font-mono font-bold uppercase tracking-wider text-emerald-400">2. Career Execution</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg flex items-center justify-between">
        <div>
          <span class="text-xs font-mono text-gray-400 block">PHONE DIALS (20 TARGET)</span>
          <span id="txtDials" class="text-2xl font-mono font-bold text-white">0</span>
        </div>
        <div class="flex space-x-2">
          <button type="button" onclick="adjustDials(-1)" class="w-8 h-8 bg-gray-800 rounded font-bold cursor-pointer">-</button>
          <button type="button" onclick="adjustDials(1)" class="w-8 h-8 bg-gray-800 rounded font-bold cursor-pointer">+1</button>
          <button type="button" onclick="adjustDials(5)" class="px-2 bg-emerald-900 text-emerald-300 rounded font-bold cursor-pointer">+5</button>
        </div>
      </div>
      <div class="bg-gray-900 border border-gray-800 p-4 rounded-lg flex items-center justify-between">
        <div>
          <span class="text-xs font-mono text-gray-400 block">CONNECTS (5 TARGET)</span>
          <span id="txtConnects" class="text-2xl font-mono font-bold text-white">0</span>
        </div>
        <div class="flex space-x-2">
          <button type="button" onclick="adjustConnects(-1)" class="w-8 h-8 bg-gray-800 rounded font-bold cursor-pointer">-</button>
          <button type="button" onclick="adjustConnects(1)" class="w-8 h-8 bg-gray-800 rounded font-bold cursor-pointer">+1</button>
        </div>
      </div>
    </div>
<!-- 3. DISCIPLINE STANDARDS -->
  <section class="glass-card rounded-xl p-5 space-y-4">
    <h2 class="text-xs font-mono font-bold uppercase tracking-wider text-gray-400">3. Core Standards</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div id="card_nosnooze" onclick="toggleHabitDirectly('nosnooze')" style="background: #18181b; border: 1px solid #27272a;" class="p-3.5 rounded-lg flex items-center justify-between cursor-pointer select-none">
        <span class="text-xs font-semibold text-gray-200">No Snooze</span>
        <input type="checkbox" id="chk_nosnooze" class="engine-box pointer-events-none">
      </div>
      <div id="card_madebed" onclick="toggleHabitDirectly('madebed')" style="background: #18181b; border: 1px solid #27272a;" class="p-3.5 rounded-lg flex items-center justify-between cursor-pointer select-none">
        <span class="text-xs font-semibold text-gray-200">Made Bed</span>
        <input type="checkbox" id="chk_madebed" class="engine-box pointer-events-none">
      </div>
      <div id="card_shaved" onclick="toggleHabitDirectly('shaved')" style="background: #18181b; border: 1px solid #27272a;" class="p-3.5 rounded-lg flex items-center justify-between cursor-pointer select-none">
        <span class="text-xs font-semibold text-gray-200">Shaved</span>
        <input type="checkbox" id="chk_shaved" class="engine-box pointer-events-none">
      </div>
      <div id="card_bedby1030" onclick="toggleHabitDirectly('bedby1030')" style="background: #18181b; border: 1px solid #27272a;" class="p-3.5 rounded-lg flex items-center justify-between cursor-pointer select-none">
        <span class="text-xs font-semibold text-gray-200">In Bed 10:30</span>
        <input type="checkbox" id="chk_bedby1030" class="engine-box pointer-events-none">
      </div>
    </div>
  </section>

  <script>
    const HABIT_KEYS = ['morning_prayer', 'bedtime_prayer', 'purity', 'nosnooze', 'madebed', 'shaved', 'bedby1030'];
    let state = { habits: {}, dials: 0, connects: 0 };

    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('kevin_discipline_state');
        if (saved) state = Object.assign(state, JSON.parse(saved));
      } catch(e) {}
      if (!state.habits[getToday()]) state.habits[getToday()] = {};
      renderUI();
    }

    function saveState() {
      try {
        localStorage.setItem('kevin_discipline_state', JSON.stringify(state));
      } catch(e) {}
      renderUI();
    }

    window.toggleHabitDirectly = function(habitId) {
      const today = getToday();
      if (!state.habits[today]) state.habits[today] = {};
      state.habits[today][habitId] = !state.habits[today][habitId];
      saveState();
    };

    window.adjustDials = function(delta) {
      state.dials = Math.max(0, (state.dials || 0) + delta);
      saveState();
    };

    window.adjustConnects = function(delta) {
      state.connects = Math.max(0, (state.connects || 0) + delta);
      saveState();
    };

    function renderUI() {
      const today = getToday();
      const todayHabits = state.habits[today] || {};

      HABIT_KEYS.forEach(k => {
        const chk = document.getElementById(`chk_${k}`);
        const card = document.getElementById(`card_${k}`);
        const isDone = !!todayHabits[k];
        if (chk) chk.checked = isDone;
        if (card) {
          card.style.borderColor = isDone ? '#52525b' : '#27272a';
          card.style.background = isDone ? '#18181b' : 'rgba(18, 18, 21, 0.9)';
        }
      });

      const txtD = document.getElementById('txtDials');
      const txtC = document.getElementById('txtConnects');
      if (txtD) txtD.textContent = state.dials || 0;
      if (txtC) txtC.textContent = state.connects || 0;

      const kD = document.getElementById('kpiDials');
      const kC = document.getElementById('kpiConnects');
      if (kD) kD.textContent = `${state.dials || 0}/20`;
      if (kC) kC.textContent = `${state.connects || 0}/5`;

      const moralCount = (todayHabits['morning_prayer']?1:0) + (todayHabits['bedtime_prayer']?1:0) + (todayHabits['purity']?1:0);
      const kMoral = document.getElementById('kpiMoral');
      if (kMoral) kMoral.textContent = `${Math.round((moralCount / 3) * 100)}%`;

      const discCount = (todayHabits['nosnooze']?1:0) + (todayHabits['madebed']?1:0) + (todayHabits['shaved']?1:0) + (todayHabits['bedby1030']?1:0);
      const kDisc = document.getElementById('kpiDiscipline');
      if (kDisc) kDisc.textContent = `${discCount}/4`;
    }

    window.addEventListener('DOMContentLoaded', loadState);
  </script>
</body>
</html>
